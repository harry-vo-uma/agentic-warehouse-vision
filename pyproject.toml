[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awvi"
version = "0.3.0"
description = "Agentic Warehouse Vision Intelligence: DeepStream tracking + VLM reasoning + agent orchestration on NVIDIA NIM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Harry Vo" }]
keywords = ["nvidia", "metropolis", "deepstream", "vlm", "nim", "vision-ai", "langgraph", "agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "httpx>=0.26",
  "fastapi>=0.109",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
agents = ["langgraph>=0.2", "langchain-core>=0.3"]
media = ["av>=11.0", "pillow>=10.0"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.4", "httpx>=0.26"]
all = ["awvi[agents,media,dev]"]

[project.scripts]
awvi = "awvi.cli:main"

[project.urls]
Homepage = "https://github.com/harry-vo-uma/agentic-warehouse-vision"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
awvi = ["api/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 118
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
